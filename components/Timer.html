<div class='flex flex-col items-center'>

                <!-- timer area -->

                <!-- Timer Label -->
                <div>
                    <h1 class='text-xl'>Timer</h1>
                </div>

                <!-- Timer Coutndown -->
                <div class="radial-progress" style="--value:70; --size:12rem" aria-valuenow="70" role="progressbar">
                    <span class="countdown font-mono text-2xl">
                    <span style="--value:00; --digits: 2;" aria-live="polite" aria-label="00">00</span>
                    :
                    <span style="--value:05; --digits: 2;" aria-live="polite" aria-label="05">05</span>
                    </span>
                </div>

                <!-- Info area -->

                <div class='flex flex-row justify-between'>
                    <!-- Reps -->
                    <div class='stats shadow'>
                        <div class='stat place-items-center'>
                            <div class='stat-title'>REP</div>
                            <div class='stat-value'>1/6</div>
                        </div>
                    </div>

                    <!-- Sets -->
                     <div class='stats shadow'>
                        <div class='stat place-items-center'>
                            <div class='stat-title'>SET</div>
                            <div class='stat-value'>1/3</div>
                        </div>
                    </div>
                </div>

                <!-- Timer controls -->
                <div class="join">
                <button class="btn join-item">Prev</button>
                <button class="btn join-item">Start</button>
                <button class="btn join-item">Skip</button>
                </div>
            </div>
