<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hangboard Timer</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class='h-screen flex flex-col bg-base-200'>
        <!-- NAVBAR -->
        <div class='navbar bg-base-100 shadow-sm justify-center items-center backdrop-blur'>
        <a class="btn btn-ghost text-3xl">Hangboard Timer</a>
        </div>

        <!-- TIMER VIEW -->
        <div id='timerView' class='flex-1 flex flex-col items-center justify-center gap-16 p-4 pb-24 hidden'>

            <!-- ROUTINE TITLE -->
            <h1 class='text-2xl'>Timer (CURRENT ROUTINE)</h1>

            <!-- TIMER -->
            <div class='radial-progress text-2xl'
                 style='--value:70; --size:12rem'
                 aria-valuenow='70'
                 role='progressbar'>
                    <span class="countdown font-mono text-3xl">
                    <span style="--value:00; --digits: 2;" aria-live="polite" aria-label="00">00</span>
                    :
                    <span style="--value:05; --digits: 2;" aria-live="polite" aria-label="05">05</span>
                    </span>
            </div>

            <!-- REPS AND SETS PROGRESS -->
            <div class='flex gap-4'>
                <div class='stats shadow'>
                    <div class='stat place-items-center'>
                        <div class='stat-title'>REP</div>
                        <div class='stat-value text-lg'>1/6</div>
                    </div>
                </div>
                <div class='stats shadow'>
                    <div class='stat place-items-center'>
                        <div class='stat-title'>SET</div>
                        <div class='stat-value text-lg'>1/3</div>
                    </div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class='join'>
                <button class="btn join-item">Prev</button>
                <button class="btn join-item btn-neutral">Start</button>
                <button class="btn join-item">Skip</button>
            </div>
        </div>

        <!-- ROUTINE VIEW -->
        <div id='savedView' class='flex-1 flex flex-col items-center justify-center gap-16 p-4 pb-24'>

            <!-- ROUTINE TITLE -->
            <h1 class='text-2xl'>Saved Routines</h1>

            <!-- ROUTINES LIST -->
            <ul class="list bg-base-100 rounded-box shadow-md">

            <li class="p-4 pb-2 text-xs opacity-60 tracking-wide">Routines</li>

            <li class="list-row">
                <div>
                <div>4x4</div>
                </div>
                <button class="btn btn-square btn-ghost">Dropdwon Icon</button>
            </li>

            <li class="list-row">
                <div><img class="size-10 rounded-box" src="https://img.daisyui.com/images/profile/demo/4@94.webp"/></div>
                <div>
                <div>Ellie Beilish</div>
                <div class="text-xs uppercase font-semibold opacity-60">Bears of a fever</div>
                </div>
                <button class="btn btn-square btn-ghost">
                <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M6 3L20 12 6 21 6 3z"></path></g></svg>
                </button>
                <button class="btn btn-square btn-ghost">
                <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></g></svg>
                </button>
            </li>

            <li class="list-row">
                <div><img class="size-10 rounded-box" src="https://img.daisyui.com/images/profile/demo/3@94.webp"/></div>
                <div>
                <div>Sabrino Gardener</div>
                <div class="text-xs uppercase font-semibold opacity-60">Cappuccino</div>
                </div>
                <button class="btn btn-square btn-ghost">
                <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M6 3L20 12 6 21 6 3z"></path></g></svg>
                </button>
                <button class="btn btn-square btn-ghost">
                <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></g></svg>
                </button>
            </li>

            </ul>

        </div>

        <!-- SETTINGS VIEW -->
        <div id='settingsView' class='flex-1 flex flex-col items-center justify-center gap-4 p-4 pb-24 hidden'>

            <!-- SETTINGS TITLE -->
            <h1 class='text-2xl'>Routine settings</h1>

            <!-- REPS AND SETS -->
            <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend">Reps & Sets</legend>

            <label class="label">Reps</label>
            <label class='input'>
                <input type="number" min='1' class="input" placeholder="#" />
                <span class='label'>reps</span>
            </label>

            <label class="label">Sets</label>
            <label class='input'>
                <input type="number" min='1' class="input" placeholder="#" />
                <span class='label'>sets</span>
            </label>
            </fieldset>

            <!-- HANG TIME AND REST BETWEEN HANGS -->
            <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend">Hang time & rest between hangs</legend>

            <label class="label">Hang time</label>
            <label class='input'>
                <input type="number" min='1' class="input" placeholder="time" />
                <span class='label'>s</span>
            </label>


            <label class="label">Rest time</label>
            <label class='input'>
                <input type="number" min='1' class="input" placeholder="time" />
                <span class='label'>s</span>
            </label>
            </fieldset>

            <!-- REST TIME BETWEEN SETS -->
            <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend">Rest time between sets</legend>

            <label class="label">Rest time</label>
            <label class='input'>
                <input type="number" min='1' class="input" placeholder="time" />
                <span class='label'>s</span>
            </label>
            </fieldset>

            <!-- SAVE BUTTON -->
             <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-xs border p-4">
                <legend class='fieldset-legend'>Routine name</legend>
                <div class="join">
                <div>
                    <div>
                    <input class="input join-item" placeholder="text" />
                    </div>
                </div>
                <div>
                    <button class="btn btn-success join-item">Save</button>
                </div>
            </div>
             </fieldset>

        </div>

        <!-- DOCK -->
        <div class='dock fixed bottom-0 left-0 right-0 bg-base-100/80 backdrop-blur'>
            <button class='dock-active'>
                <span class='dock-label'>Routines</span>
            </button>
            <button class=''>
                <span class='dock-label'>Timer</span>
            </button>
            <button class=''>
                <span class='dock-label'>Settings</span>
            </button>
        </div>
    </body>
</html>
